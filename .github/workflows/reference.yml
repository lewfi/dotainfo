name: Refresh reference data

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reference-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.5"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Refresh reference Parquet
        run: python -m ingest.reference

      - name: Commit changed reference data
        shell: bash
        run: |
          git add -A data/reference
          if git diff --cached --quiet; then
            echo "No reference changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh reference data"
          git pull --rebase origin main
          git push
